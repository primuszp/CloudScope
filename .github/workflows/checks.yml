name: Code checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet build Source/CloudScope.slnx -c ${{ matrix.configuration }} -warnaserror
      - run: dotnet run --project Source/CloudScope.CommandChecks -c ${{ matrix.configuration }} --no-build
      - run: dotnet run --project Source/CloudScope.UiChecks -c ${{ matrix.configuration }} --no-build -- artifacts/ui
      - name: Verify generated command inventory
        run: |
          dotnet run --project Source/CloudScope.CommandChecks -c ${{ matrix.configuration }} --no-build -- --write-inventory Docs/CommandInventory.md
          git diff --exit-code -- Docs/CommandInventory.md
      - name: Record allocation benchmark
        run: dotnet run --project Source/CloudScope.CommandChecks -c ${{ matrix.configuration }} --no-build -- --benchmark > artifacts/performance.json
      - name: Build portable viewer
        run: dotnet build Source/CloudScope/CloudScope.csproj -c ${{ matrix.configuration }} --artifacts-path artifacts/portable -p:EnableSharpMetal=false -p:EnableImGui=false -warnaserror
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            artifacts/ui
            artifacts/performance.json
